<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Invoice Extractor — Settings</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 420px; margin: 24px auto; color: #1f2937; }
  h1 { font-size: 16px; }
  label { display: block; font-size: 13px; margin-bottom: 6px; font-weight: 600; }
  input[type="password"] { width: 100%; padding: 8px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
  button { margin-top: 10px; padding: 8px 16px; border: none; border-radius: 6px; background: #111827; color: white; cursor: pointer; font-size: 13px; }
  p.hint { font-size: 12px; color: #6b7280; }
  p.hint a { color: #2563eb; }
  #status { font-size: 12px; color: #16a34a; margin-left: 10px; }
</style>
</head>
<body>
  <h1>Invoice Extractor — Settings</h1>
  <label for="apiKey">Google Gemini API key</label>
  <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off">
  <p class="hint">Get a <strong>free</strong> key at <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> — no credit card needed, just a Google account. It's stored only in your browser's local extension storage and is sent only to Google's API when you click Extract.</p>
  <button id="saveBtn">Save</button>
  <span id="status" hidden>Saved</span>
  <script src="options.js"></script>
</body>
</html>
