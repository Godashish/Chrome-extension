<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Invoice Extractor</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Invoice Extractor</h1>
    <button id="settingsBtn" title="Settings">&#9881;</button>
  </header>

  <section id="inputSection">
    <textarea id="inputText" placeholder="Paste an invoice or payment email here..."></textarea>
    <div id="errorMsg" class="error" hidden></div>
    <button id="extractBtn">Extract</button>
  </section>

  <section id="listSection">
    <div id="emptyState" class="empty">No invoices yet. Paste one above to get started.</div>
    <ul id="invoiceList"></ul>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
